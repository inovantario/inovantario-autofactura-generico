    function invoiceView(xml,uuid,branding={}){
      applyBranding(branding);
      const ct=branding?.contact||{},contactHtml=[ct.address,ct.phone,ct.email].filter(Boolean).map(x=>'<p class="contact">'+escapeHtml(x)+'</p>').join('');
      const doc=new DOMParser().parseFromString(xml,'application/xml'),one=name=>doc.getElementsByTagNameNS('*',name)[0],all=name=>Array.from(doc.getElementsByTagNameNS('*',name)),c=one('Comprobante'),e=one('Emisor'),r=one('Receptor'),t=one('TimbreFiscalDigital'),taxes=Array.from(c.children).find(n=>n.localName==='Impuestos'),attr=(node,name)=>node?.getAttribute(name)||'';
      const concepts=all('Concepto').map(x=>'<tr><td>'+escapeHtml(attr(x,'Descripcion'))+'<br><small>No. identificación: '+escapeHtml(attr(x,'NoIdentificacion'))+' · Clave: '+escapeHtml(attr(x,'ClaveProdServ'))+' · Unidad: '+escapeHtml(attr(x,'ClaveUnidad'))+'</small></td><td>'+escapeHtml(attr(x,'Cantidad'))+'</td><td>'+money(attr(x,'ValorUnitario'))+'</td><td>'+money(attr(x,'Importe'))+'</td><td>'+escapeHtml(attr(x,'ObjetoImp'))+'</td></tr>').join('');
      const total=attr(c,'Total'),seal=attr(t,'SelloCFD'),verify='https://verificacfdi.facturaelectronica.sat.gob.mx/default.aspx?id='+encodeURIComponent(uuid)+'&re='+encodeURIComponent(attr(e,'Rfc'))+'&rr='+encodeURIComponent(attr(r,'Rfc'))+'&tt='+encodeURIComponent(Number(total).toFixed(6))+'&fe='+encodeURIComponent(seal.slice(-8));currentQr=verify;
      return '<h1>Factura generada</h1><div class="invoice-scroll"><article class="invoice-sheet"><header class="invoice-top"><div class="invoice-logo">'+logoHtml(branding)+'</div><div class="issuer"><h2>'+escapeHtml(attr(e,'Nombre'))+'</h2><p>'+escapeHtml(attr(e,'Rfc'))+'</p><p>('+escapeHtml(attr(e,'RegimenFiscal'))+') '+escapeHtml(regimeNames[attr(e,'RegimenFiscal')]||'Régimen fiscal')+'</p><p><b>Lugar de expedición:</b> '+escapeHtml(attr(c,'LugarExpedicion'))+'</p>'+contactHtml+'</div><div class="document"><h2>FACTURA ELECTRÓNICA</h2><p><b>Folio:</b> '+escapeHtml(attr(c,'Serie')+'-'+attr(c,'Folio'))+'</p><p><b>Versión:</b> '+escapeHtml(attr(c,'Version'))+'</p><p><b>Tipo de comprobante:</b> ('+escapeHtml(attr(c,'TipoDeComprobante'))+') Ingreso</p><p><b>Lugar de expedición:</b> ('+escapeHtml(attr(c,'LugarExpedicion'))+')</p><p><b>No. certificado:</b> '+escapeHtml(attr(c,'NoCertificado'))+'</p></div></header><section class="invoice-meta"><div><h3 class="section-title">RECEPTOR</h3><p>'+escapeHtml(attr(r,'Nombre'))+'</p><p>'+escapeHtml(attr(r,'Rfc'))+'</p><p><b>Domicilio fiscal:</b> '+escapeHtml(attr(r,'DomicilioFiscalReceptor'))+'</p><p><b>Régimen fiscal:</b> ('+escapeHtml(attr(r,'RegimenFiscalReceptor'))+') '+escapeHtml(regimeNames[attr(r,'RegimenFiscalReceptor')]||'')+'</p><p><b>Uso del CFDI:</b> ('+escapeHtml(attr(r,'UsoCFDI'))+') '+escapeHtml(useNames[attr(r,'UsoCFDI')]||'')+'</p></div><div><p><b>Fecha de emisión:</b> '+escapeHtml(attr(c,'Fecha'))+'</p><p><b>Moneda:</b> ('+escapeHtml(attr(c,'Moneda'))+') Peso Mexicano</p><p><b>Tipo de cambio:</b> '+escapeHtml(attr(c,'TipoCambio'))+'</p><p><b>Forma de pago:</b> ('+escapeHtml(attr(c,'FormaPago'))+') '+escapeHtml(paymentNames[attr(c,'FormaPago')]||'')+'</p><p><b>Método de pago:</b> ('+escapeHtml(attr(c,'MetodoPago'))+') '+(attr(c,'MetodoPago')==='PUE'?'Pago en una sola exhibición':'Pago en parcialidades o diferido')+'</p><p><b>Exportación:</b> ('+escapeHtml(attr(c,'Exportacion'))+') No aplica</p></div><div class="c     }
    function fitInvoice(){const box=document.querySelector('.invoice-scroll'),sheet=document.querySelector('.invoice-sheet');if(!box||!sheet)return;sheet.style.transform='';sheet.style.margin='';box.style.height='';if(window.innerWidth>720)return;const scale=Math.min(1,box.clientWidth/sheet.offsetWidth);sheet.style.margin='0';sheet.style.transform='scale('+scale+')';box.style.height=Math.ceil(sheet.offsetHeight*scale)+'px'}
    addEventListener('resize',fitInvoice);
    let currentPdf={pdf:{},contact:{}},pdfBlobPromise=null;
    // The PDF is built in the browser by the same code the app uses (autofactura_pdf.js), so customers get an identical file.
    function loadPdfLib(){return window.generateFiscalPdfBase64?Promise.resolve():new Promise((ok,fail)=>{const s=document.createElement('script');s.src='autofactura_pdf.js';s.onload=ok;s.onerror=()=>fail(new Error('No se pudo cargar el generador de PDF.'));document.head.appendChild(s)})}
    function getPdf(xml){if(!pdfBlobPromise)pdfBlobPromise=loadPdfLib().then(()=>generateFiscalPdfBase64(xml,JSON.stringify(currentPdf))).then(b64=>new Blob([Uint8Array.from(atob(b64),c=>c.charCodeAt(0))],{type:'application/pdf'})).catch(e=>{pdfBlobPromise=null;throw e});return pdfBlobPromise}
    function bindActions(xml,uuid){
      pdfBlobPromise=null;
      const status=document.getElementById('action-status'),say=t=>{status.textContent=t};
      const files=async()=>{const wantXml=document.getElementById('pick-xml').checked,wantPdf=document.getElementById('pick-pdf').checked,list=[];if(!wantXml&&!wantPdf)throw new Error('Selecciona XML, PDF o ambos.');if(wantXml)list.push(new File([xml],'CFDI-'+uuid+'.xml',{type:'application/xml'}));if(wantPdf)list.push(new File([await getPdf(xml)],'CFDI-'+uuid+'.pdf',{type:'application/pdf'}));return list};
      const saveFile=file=>new Promise(done=>{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{URL.revokeObjectURL(a.href);done()},400)});
      document.getElementById('download').onclick=async()=>{try{say('Preparando…');for(const f of await files())await saveFile(f);say('Listo. Revisa tus descargas.')}catch(e){say(e.message)}};
      document.getElementById('share').onclick=async()=>{try{say('Preparando…');const list=await files();if(navigator.canShare&&navigator.canShare({files:list})){await navigator.share({files:list,title:'Mi factura'});say('')}else{for(const f of list)await saveFile(f);say('Tu navegador no permite compartir; se descargaron los archivos.')}}catch(e){say(e.name==='AbortError'?'':e.message)}};
      document.getElementById('print').onclick=async()=>{try{say('Preparando PDF…');const url=URL.createObjectURL(await getPdf(xml));if(matchMedia('(pointer:coarse)').matches){window.open(url,'_blank')||(location.href=url)}else{const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';f.src=url;f.onload=()=>{f.contentWindow.focus();f.contentWindow.print()};document.body.appendChild(f)}say('')}catch(e){say(e.message)}};
    }
    function renderQr(){fitInvoice();setTimeout(fitInvoice,300);const canvas=document.getElementById('qr');if(!canvas||!currentQr||typeof qrcode==='undefined')return;const qr=qrcode(0,'M');qr.addData(currentQr);qr.make();const n=qr.getModuleCount(),size=315,cell=size/n,ctx=canvas.getContext('2d');canvas.width=size;canvas.height=size;ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect(Math.floor(c*cell),Math.floor(r*cell),Math.ceil(cell),Math.ceil(cell))}
    const regimes='<option value="">Selecciona tu régimen</option><option value="601">601 · General de Ley Personas Morales</option><option value="603">603 · Personas Morales con Fines no Lucrativos</option><option value="605">605 · Sueldos y Salarios e Ingresos Asimilados a Salarios</option><option value="606">606 · Arrendamiento</option><option value="607">607 · Régimen de Enajenación o Adquisición de Bienes</option><option value="608">608 · Demás ingresos</option><option value="610">610 · Residentes en el Extranjero sin Establecimiento Permanente en México</option><option value="611">611 · Ingresos por Dividendos (socios y accionistas)</option><option value="612">612 · Personas Físicas con Actividades Empresariales y Profesionales</option><option value="614">614 · Ingresos por intereses</option><option value="615">615 · Régimen de los ingresos por obtención de premios</option><option value="616">616 · Sin obligaciones fiscales</option><option value="620">620 · Sociedades Cooperativas de Producción que optan por diferir sus ingresos</option><option value="621">621 · Incorporación Fiscal</option><option value="622">622 · Actividades Agrícolas, Ganaderas, Silvícolas y Pesqueras</option><option value="623">623 · Opcional para Grupos de Sociedades</option><option value="624">624 · Coordinados</option><option value="625">625 · Régimen de las Actividades Empresariales con ingresos a través de Plataformas Tecnológicas</option><option value="626">626 · Régimen Simplificado de Confianza</option>';
    const uses='<option value="">Selecciona el uso del CFDI</option><option value="G01">G01 · Adquisición de mercancías</option><option value="G02">G02 · Devoluciones, descuentos o bonificaciones</option><option value="G03">G03 · Gastos en general</option><option value="I01">I01 · Construcciones</option><option value="I02">I02 · Mobiliario y equipo de oficina</option><option value="I03">I03 · Equipo de transporte</option><option value="I04">I04 · Equipo de cómputo</option><option value="I05">I05 · Dados, troqueles y moldes</option><option value="I06">I06 · Comunicaciones telefónicas</option><option value="I07">I07 · Comunicaciones satelitales</option><option value="I08">I08 · Otra maquinaria y equipo</option><option value="D01">D01 · Honorarios médicos</option><option value="D02">D02 · Gastos médicos por incapacidad</option><option value="D03">D03 · Gastos funerales</option><option value="D04">D04 · Donativos</option><option value="D05">D05 · Intereses hipotecarios</option><option value="D06">D06 · Aportaciones voluntarias al SAR</option><option value="D07">D07 · Primas por seguros médicos</option><option value="D08">D08 · Transportación escolar</option><option value="D09">D09 · Depósitos para el ahorro</option><option value="D10">D10 · Pagos por servicios educativos</option><option value="S01">S01 · Sin efectos fiscales</option><option value="CP01">CP01 · Pagos</option><option value="CN01">CN01 · Nómina</option>';
    async function load(){try{const ticket=await call({action:'public_ticket',token});currentBranding=ticket.branding||{};currentBranding.contact=ticket.issuer_contact||{};currentPdf={pdf:ticket.pdf_settings||{},contact:ticket.issuer_contact||{}};showBusiness(ticket);if(ticket.status==='invoiced'){content.innerHTML=invoiceView(ticket.invoice_xml,ticket.invoice_uuid,currentBranding);renderQr();bindActions(ticket.invoice_xml,ticket.invoice_uuid);return}if(!['pending','error'].includes(ticket.status))throw new Error('Este ticket no está disponible para facturar.');content.innerHTML='<h1>Autofactura</h1><p>Ticket <b>'+escapeHtml(ticket.ticket_number)+'</b></p><p class="total">'+Number(ticket.total).toLocaleString('es-MX',{style:'currency',currency:'MXN'})+'</p><form id="form"><label>RFC<input name="rfc" maxlength="13" required></label><label>Nombre o razón social<input name="legal_name" required></label><label>Código postal fiscal<input name="postal_code" inputmode="numeric" maxlength="5" required></label><label>Régimen fiscal<select name="tax_regime" required>'+regimes+'</select></label><label>Uso del CFDI<select name="cfdi_use" required>'+uses+'</select></label><label>Correo electrónico<input name="email" type="email" required></label><button>Generar factura</button><p class="note">Verifica tus datos. Al timbrar ya no podrán editarse.</p><p id="message"></p></form>';document.getElementById('form').onsubmit=submit}catch(error){content.innerHTML='<h1>Ticket no disponible</h1><p class="error">'+escapeHtml(error.message)+'</p>'}}
    async function submit(event){event.preventDefault();const button=event.target.querySelector('button'),message=document.getElementById('message');button.disabled=true;message.className='';message.textContent='Generando factura…';try{const customer=Object.fromEntries(new FormData(event.target));const result=await call({action:'invoice_ticket',token,customer});content.innerHTML=invoiceView(result.cfdi_xml,result.uuid,currentBranding);renderQr();bindActions(result.cfdi_xml,result.uuid)}catch(error){message.className='error';message.textContent=error.message;button.disabled=false}}
    load();
  </script>
